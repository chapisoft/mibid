name: mibid

services:
  # ============================================================
  # 1. MIBID BACKEND APPLICATION SERVER (JAVA 21 / SPRING BOOT 3)
  # ============================================================
  mibid-backend:
    build:
      context: ../src/backend
      dockerfile: Dockerfile
    image: mibid/backend-server:1.0.0
    container_name: mibid-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://mibid-postgres:5432/mibid_prod
      SPRING_DATASOURCE_USERNAME: mibid_admin
      SPRING_DATASOURCE_PASSWORD: MibidSecure2026!
      SPRING_DATA_REDIS_HOST: mibid-redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://mibid-minio:9000
      MINIO_ACCESS_KEY: mibidadmin
      MINIO_SECRET_KEY: MinioSecure2026!
      MIBID_JWT_SECRET: MibidSecretKeyForJwtSigningMustBeAtLeast32BytesLong2026!
    depends_on:
      mibid-postgres:
        condition: service_healthy
      mibid-redis:
        condition: service_healthy
      mibid-minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - mibid-network

  # ============================================================
  # 2. POSTGRESQL 15+ (Hỗ trợ Multi-tenant Row-Level Security)
  # ============================================================
  mibid-postgres:
    image: postgres:15-alpine
    container_name: mibid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mibid_prod
      POSTGRES_USER: mibid_admin
      POSTGRES_PASSWORD: MibidSecure2026!
    ports:
      - "5432:5432"
    volumes:
      - mibid_pg_data:/var/lib/postgresql/data
      - ../database/001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/002_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mibid_admin -d mibid_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mibid-network

  # ============================================================
  # 3. REDIS 7 (Khóa Phân Tán Redisson & Bộ Nhớ Đệm)
  # ============================================================
  mibid-redis:
    image: redis:7-alpine
    container_name: mibid-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - mibid_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - mibid-network

  # ============================================================
  # 4. MINIO OBJECT STORAGE (Kho Lưu Trữ Chứng Từ S3 DMS)
  # ============================================================
  mibid-minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: mibid-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mibidadmin
      MINIO_ROOT_PASSWORD: MinioSecure2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mibid_minio_data:/data
    networks:
      - mibid-network

volumes:
  mibid_pg_data:
  mibid_redis_data:
  mibid_minio_data:

networks:
  mibid-network:
    driver: bridge
