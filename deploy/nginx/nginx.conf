# ============================================================
# MIBID NGINX REVERSE PROXY & GATEWAY CONFIGURATION
# Tên miền Frontend (FE): bid.microtec.vn (Cổng nội bộ 3000)
# Tên miền Backend  (BE): api-bid.microtec.vn (Cổng nội bộ 8080)
# ============================================================

# 1. CỔNG GIAO DIỆN FRONTEND WEBAPP (bid.microtec.vn)
server {
    listen 80;
    server_name bid.microtec.vn;

    client_max_body_size 100M;

    # Chuyển tiếp toàn bộ API RESTful sang Backend
    location /api/ {
        proxy_pass http://mibid-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Giao diện Frontend WebApp (Staff CMS & Vendor Portal)
    location / {
        proxy_pass http://mibid-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. CỔNG API BACKEND VÀ ACTUATOR (api-bid.microtec.vn)
server {
    listen 80;
    server_name api-bid.microtec.vn;

    client_max_body_size 100M;

    # Điểm cuối API RESTful
    location / {
        proxy_pass http://mibid-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kết nối WebSocket thời gian thực
    location /ws/ {
        proxy_pass http://mibid-backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Cổng MinIO S3 Storage DMS
    location /storage/ {
        proxy_pass http://mibid-minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 3. ĐIỀU PHỐI MẶC ĐỊNH CHO MÔI TRƯỜNG CỤC BỘ / LOCALHOST / IP
server {
    listen 80 default_server;
    server_name localhost _;

    client_max_body_size 100M;

    # Mặc định điều hướng vào Frontend WebApp
    location / {
        proxy_pass http://mibid-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Chuyển tiếp API nếu gọi qua cùng IP
    location /api/ {
        proxy_pass http://mibid-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://mibid-backend:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
