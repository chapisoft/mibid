server:
  port: 8080

spring:
  application:
    name: mibid-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mibid_db}
    username: ${SPRING_DATASOURCE_USERNAME:mibid_user}
    password: ${SPRING_DATASOURCE_PASSWORD:mibid_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mibid:
  jwt:
    secret: ${MIBID_JWT_SECRET:mibidSecretKeyMustBeVeryLongForHmacSha256SecurityStandards2026!}
    access-expiration-ms: 900000 # 15 minutes
    magic-link-expiration-ms: 259200000 # 72 hours
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:mibidadmin}
    secret-key: ${MINIO_SECRET_KEY:MinioSecure2026!}
    bucket-name: mibid-documents
