# MIBID Backend I18N Messages - English
app.name=MIBID

# ---- General Errors ----
error.success=Operation completed successfully
error.badRequest=Request payload is invalid or malformed
error.unauthorized=Unauthorized access or session has expired
error.authenticationFailed=Invalid username or password
error.forbidden=You do not have permission to perform this action
error.userAccountLocked=User account has been temporarily locked
error.notFound=Requested resource not found
error.resourceNotFound=Record not found in database
error.conflict=Resource already exists or data state conflict detected
error.resourceConflict=Record already exists in the system
error.validation=Input payload failed validation rules
error.internal=Internal server error occurred. Please contact system administrator

# ---- Gatekeeper & Workflow ----
error.gatekeeperHardStop=Transition blocked: Mandatory gatekeeper documents or criteria not satisfied
error.lockTimeout=System is busy processing a concurrent request. Please retry shortly

# ---- Vendor Portal & Magic Link ----
