error.portal.invalidPin=Security PIN is incorrect
error.portal.locked=Vendor portal temporarily locked due to 5 consecutive failed PIN attempts
error.portal.captchaRequired=CAPTCHA verification required
error.portal.pinRequired=Please enter the 6-digit security PIN to continue

