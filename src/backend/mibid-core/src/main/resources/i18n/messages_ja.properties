# MIBID Backend I18N Messages - 日本語
app.name=MIBID

# ---- 一般エラー ----
error.success=処理が正常に完了しました
error.badRequest=リクエストデータが無効または不正な形式です
error.unauthorized=認証が無効であるか、セッションの有効期限が切れています
error.authenticationFailed=ユーザー名またはパスワードが正しくありません
error.forbidden=この操作を実行する権限がありません
error.userAccountLocked=ユーザーアカウントが一時的にロックされています
error.notFound=要求されたリソースが見つかりません
error.resourceNotFound=データベースにレコードが見つかりません
error.conflict=リソースが既に存在するか、データ競合が発生しました
error.resourceConflict=システムにレコードが既に存在します
error.validation=入力データがバリデーションチェックに合格しませんでした
error.internal=内部サーバーエラーが発生しました。システム管理者にお問い合わせください

# ---- ゲートキーパー & ワークフロー ----
error.gatekeeperHardStop=ステータス移行遮断：必須のゲートキーパー書類または基準を満たしていません
error.lockTimeout=並行リクエストを処理中です。しばらくしてから再試行してください

# ---- ベンダーポータル & Magic Link ----
error.portal.magicLinkExpired=見積もりリンクの有効期限が切れました。調達チームに新しいリンクを依頼してください
error.portal.invalidPin=セキュリティPINが正しくありません
error.portal.locked=PIN入力を5回連続で誤ったため、ベンダーポータルが一時的にロックされました
error.portal.captchaRequired=CAPTCHAセキュリティ認証が必要です
error.portal.pinRequired=続行するには6桁のセキュリティPINを入力してください

# ---- RFQ & ソーシング ----
error.rfq.tenantIdRequired=RFQ作成時にテナントIDが欠落または無効です
error.rfq.notFound=システムにRFQ（見積依頼書）が見つかりません
error.rfq.vendorNotFound=データベースにベンダー招待レコードが見つかりません

# ---- パートナー / サプライヤー ----
error.partner.tenantIdRequired=パートナープロファイル作成時にテナントIDが欠落または無効です
error.partner.codeConflict=パートナーまたは企業コードがシステムに既に存在します
error.tenant.notFound=システム内に企業テナント情報が見つかりません
error.tenant.codeConflict=テナントコードは既に存在します
error.shipment.tenantIdRequired=出荷レコード作成時にテナントIDは必須です
error.task.tenantIdRequired=タスク作成時にテナントIDは必須です
error.s3.uploadFailed=S3/MinIOアップロード用署名付きURLの生成に失敗しました
error.s3.downloadFailed=S3/MinIOダウンロード用署名付きURLの生成に失敗しました
error.security.hashFailed=セキュリティハッシュ計算に失敗しました

# ---- 分散ロック ----
error.menu.cannotDeleteSystemMenu=デフォルトのシステムメニューは削除できません
error.lock.interrupted=分散ロックの取得が中断されました。再試行してください


# ---- ワークフロー ----
error.workflow.notFound=システムにワークフロー定義が見つかりません

# ---- サブスクリプション通知 ----
notification.subscription.renewal.title=MIBID サブスクリプションの更新が完了しました
notification.subscription.renewal.message=プラン {planName} の契約が {endDate} まで正常に更新されました
