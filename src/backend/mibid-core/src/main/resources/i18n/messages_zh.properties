# MIBID Backend I18N Messages - 中文 (简体)
app.name=MIBID

# ---- 通用错误 ----
error.success=操作执行成功
error.badRequest=请求数据无效或格式错误
error.unauthorized=未授权访问或登录会话已过期
error.authenticationFailed=用户名或密码不正确
error.forbidden=您没有权限执行此操作
error.userAccountLocked=用户账户已被临时锁定
error.notFound=未找到请求的资源
error.resourceNotFound=数据库中未找到相应记录
error.conflict=资源已存在或存在数据冲突
error.resourceConflict=系统中已存在该记录
error.validation=输入数据未通过有效性验证
error.internal=发生内部服务器错误，请联系系统管理员

# ---- 关卡与工作流 ----
error.gatekeeperHardStop=流转阻断：未满足关卡准入必要的资质文件或审核标准
error.lockTimeout=系统正在处理并发请求，请稍后重试

# ---- 供应商门户与 Magic Link ----
error.portal.magicLinkExpired=报价链接已过期，请联系采购部门获取新链接
error.portal.invalidPin=安全PIN码不正确
error.portal.locked=因连续5次输入错误PIN码，供应商门户已被临时锁定
error.portal.captchaRequired=需要完成CAPTCHA安全验证
error.portal.pinRequired=请输入6位安全PIN码以继续

# ---- RFQ 与采购 ----
error.rfq.tenantIdRequired=创建RFQ时租户标识符缺失或无效
error.tenant.notFound=系统中未找到企业租户信息
error.tenant.codeConflict=企业代码已存在于系统中
error.shipment.tenantIdRequired=创建货运记录时企业租户ID不能为空
error.task.tenantIdRequired=创建任务时企业租户ID不能为空
error.s3.uploadFailed=生成S3/MinIO上传预签名链接失败
error.s3.downloadFailed=生成S3/MinIO下载预签名链接失败
error.security.hashFailed=计算安全哈希失败
error.rfq.notFound=系统中未找到该询价单（RFQ）
error.rfq.vendorNotFound=数据库中未找到供应商邀请记录

# ---- 合作伙伴 / 供应商 ----
error.partner.tenantIdRequired=创建合作伙伴档案时租户标识符缺失或无效
error.partner.codeConflict=该合作伙伴或企业代码已存在于系统中

# ---- 分布式锁 ----
error.menu.cannotDeleteSystemMenu=无法删除默认系统菜单
error.lock.interrupted=分布式锁获取被中断，请重试


# ---- Workflow ----
error.workflow.notFound=系统中未找到工作流定义

# ---- 订阅通知 ----
notification.subscription.renewal.title=MIBID 服务续订成功
notification.subscription.renewal.message={planName} 套餐的订阅合同已成功续订至 {endDate}
