# MIBID Backend I18N Messages - 한국어
app.name=MIBID

# ---- 일반 오류 ----
error.success=작업이 성공적으로 완료되었습니다
error.badRequest=요청 데이터가 유효하지 않거나 형식이 잘못되었습니다
error.unauthorized=인증이 유효하지 않거나 세션이 만료되었습니다
error.authenticationFailed=사용자 이름 또는 비밀번호가 잘못되었습니다
error.forbidden=이 작업을 수행할 권한이 없습니다
error.userAccountLocked=사용자 계정이 일시적으로 잠겨 있습니다
error.notFound=요청한 리소스를 찾을 수 없습니다
error.resourceNotFound=데이터베이스에서 레코드를 찾을 수 없습니다
error.conflict=리소스가 이미 존재하거나 데이터 충돌이 발생했습니다
error.resourceConflict=시스템에 해당 레코드가 이미 존재합니다
error.validation=입력 데이터가 유효성 검사를 통과하지 못했습니다
error.internal=내부 서버 오류가 발생했습니다. 시스템 관리자에게 문의하십시오

# ---- 게이트키퍼 & 워크플로우 ----
error.gatekeeperHardStop=단계 전환 차단: 필수 게이트키퍼 제출 서류 또는 기준이 충족되지 않았습니다
error.lockTimeout=동시 요청을 처리 중입니다. 잠시 후 다시 시도하십시오

# ---- 벤더 포털 & Magic Link ----
error.portal.magicLinkExpired=견적 링크가 만료되었습니다. 새 링크는 구매팀에 문의하십시오
error.portal.invalidPin=보안 PIN이 올바르지 않습니다
error.portal.locked=PIN을 5회 연속 잘못 입력하여 벤더 포털이 일시적으로 잠겼습니다
error.portal.captchaRequired=CAPTCHA 보안 인증이 필요합니다
error.portal.pinRequired=계속하려면 6자리 보안 PIN을 입력하십시오

# ---- RFQ & 소싱 ----
error.rfq.tenantIdRequired=RFQ 생성 시 테넌트 식별자가 누락되었거나 유효하지 않습니다
error.rfq.notFound=시스템에서 해당 RFQ(견적 요청서)를 찾을 수 없습니다
error.rfq.vendorNotFound=데이터베이스에서 벤더 초대 레코드를 찾을 수 없습니다

# ---- 파트너 / 공급업체 ----
error.partner.tenantIdRequired=파트너 프로필 생성 시 테넌트 식별자가 누락되었거나 유효하지 않습니다
error.partner.codeConflict=파트너 또는 기업 코드가 시스템에 이미 존재합니다
error.tenant.notFound=시스템에서 기업 테넌트 정보를 찾을 수 없습니다
error.tenant.codeConflict=테넌트 코드가 이미 존재합니다
error.shipment.tenantIdRequired=선적 생성 시 테넌트 ID는 필수입니다
error.task.tenantIdRequired=작업 생성 시 테넌트 ID는 필수입니다
error.s3.uploadFailed=S3/MinIO 업로드 사전 서명 URL 생성 실패
error.s3.downloadFailed=S3/MinIO 다운로드 사전 서명 URL 생성 실패
error.security.hashFailed=보안 해시 계산 실패

# ---- 분산 잠금 ----
error.menu.cannotDeleteSystemMenu=기본 시스템 메뉴는 삭제할 수 없습니다
error.lock.interrupted=분산 잠금 획득이 중단되었습니다. 다시 시도하십시오


# ---- 워크플로우 ----
error.workflow.notFound=시스템에서 워크플로우 정의를 찾을 수 없습니다

# ---- 구독 알림 ----
notification.subscription.renewal.title=MIBID 구독 갱신 완료
notification.subscription.renewal.message={planName} 플랜 계약이 {endDate}까지 성공적으로 갱신되었습니다
